<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>解表药知识图谱 · 以证统药</title>
<style>
  :root {
    --paper: #f3eee3;
    --paper-2: #fbf8f1;
    --ink: #211d18;
    --ink-2: #4a4238;
    --muted: #7b7164;
    --line: #d9cfbf;
    --line-soft: #e7dfd1;
    --cinnabar: #a63d2f;
    --cinnabar-soft: #f3e2dc;
    --jade: #3f6b5a;
    --jade-soft: #e3ece7;
    --gold: #9a7a45;
    --gold-soft: #f1e7d4;
    --shadow: 0 18px 44px rgba(33, 29, 24, 0.08);
    --serif: "Songti SC", "Noto Serif SC", "STSong", "SimSun", serif;
    --sans: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; }
  button { color: inherit; }
  ::selection { background: var(--cinnabar-soft); color: var(--ink); }

  .app {
    display: grid;
    grid-template-columns: 296px minmax(0, 1fr);
    min-height: 100vh;
  }

  /* ---------- sidebar ---------- */
  .sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    padding: 28px 18px 24px;
    background: #221e19;
    color: #f3eee3;
    border-right: 1px solid rgba(255, 255, 255, 0.06);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 8px;
  }
  .seal {
    width: 46px;
    height: 46px;
    flex: 0 0 46px;
    display: grid;
    place-items: center;
    background: var(--cinnabar);
    color: #fff8ee;
    font-family: var(--serif);
    font-size: 24px;
    border-radius: 4px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
  }
  .brand h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: 23px;
    font-weight: 600;
    letter-spacing: 0.12em;
  }
  .brand p {
    margin: 3px 0 0;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: rgba(243, 238, 227, 0.5);
  }
  .search {
    position: relative;
    margin: 26px 8px 18px;
  }
  .search input {
    width: 100%;
    padding: 10px 12px 10px 34px;
    border: 1px solid rgba(243, 238, 227, 0.14);
    border-radius: 7px;
    outline: none;
    background: rgba(255, 255, 255, 0.045);
    color: #f3eee3;
    font-size: 13px;
    transition: border-color 0.18s, background 0.18s;
  }
  .search input::placeholder { color: rgba(243, 238, 227, 0.36); }
  .search input:focus {
    border-color: rgba(243, 238, 227, 0.34);
    background: rgba(255, 255, 255, 0.07);
  }
  .search svg {
    position: absolute;
    left: 11px;
    top: 50%;
    width: 14px;
    height: 14px;
    transform: translateY(-50%);
    stroke: rgba(243, 238, 227, 0.4);
    fill: none;
    stroke-width: 1.8;
  }
  .nav { padding-bottom: 12px; }
  .nav-group { margin-bottom: 16px; }
  .nav-group-title {
    padding: 0 10px;
    margin-bottom: 5px;
    font-size: 10px;
    letter-spacing: 0.16em;
    color: rgba(243, 238, 227, 0.38);
  }
  .nav-item {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: rgba(243, 238, 227, 0.76);
    text-align: left;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.16s, color 0.16s, box-shadow 0.16s;
  }
  .nav-item:hover {
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
  }
  .nav-item.active {
    background: rgba(166, 61, 47, 0.24);
    color: #fff;
    box-shadow: inset 3px 0 0 var(--cinnabar);
  }
  .nav-count {
    flex: 0 0 auto;
    min-width: 22px;
    padding: 1px 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: rgba(243, 238, 227, 0.6);
    font-size: 10px;
    text-align: center;
  }
  .nav-item.active .nav-count {
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
  }
  .nav-empty {
    padding: 12px 10px;
    font-size: 12px;
    line-height: 1.7;
    color: rgba(243, 238, 227, 0.42);
  }
  .sidebar-foot {
    margin: 24px 8px 0;
    padding-top: 16px;
    border-top: 1px solid rgba(243, 238, 227, 0.1);
    font-size: 11px;
    line-height: 1.8;
    color: rgba(243, 238, 227, 0.36);
  }
  .sidebar-foot b {
    display: block;
    margin-bottom: 3px;
    color: rgba(243, 238, 227, 0.62);
    font-weight: 500;
  }

  /* ---------- main ---------- */
  .main {
    min-width: 0;
    padding: 28px 36px 72px;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 22px;
  }
  .crumb {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .crumb .root { color: var(--cinnabar); font-weight: 500; }
  .crumb .sep { color: #b8aa96; }
  .crumb strong { color: var(--ink); font-weight: 500; }
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .stat {
    padding: 5px 11px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper-2);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .stat b {
    margin-right: 2px;
    color: var(--ink);
    font-family: var(--serif);
    font-size: 14px;
    font-weight: 600;
  }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    overflow: hidden;
    padding: 34px 36px 30px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--paper-2);
    box-shadow: var(--shadow);
  }
  .hero::after {
    content: "以证统药";
    position: absolute;
    top: 30px;
    right: 34px;
    writing-mode: vertical-rl;
    font-family: var(--serif);
    font-size: 54px;
    letter-spacing: 0.16em;
    color: rgba(166, 61, 47, 0.055);
    pointer-events: none;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--cinnabar);
  }
  .hero h2 {
    margin: 8px 0 10px;
    font-family: var(--serif);
    font-size: clamp(32px, 4.2vw, 50px);
    font-weight: 600;
    letter-spacing: 0.06em;
    line-height: 1.18;
  }
  .hero-lead {
    max-width: 720px;
    margin: 0;
    font-size: 14px;
    line-height: 1.85;
    color: var(--ink-2);
  }
  .hero-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
    margin-top: 24px;
  }
  .hero-stat {
    padding-left: 12px;
    border-left: 2px solid var(--cinnabar);
  }
  .hero-stat b {
    display: block;
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 600;
    line-height: 1.2;
  }
  .hero-stat span {
    display: block;
    margin-top: 2px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
  .hero-action {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 24px;
    padding: 9px 15px;
    border: 1px solid var(--cinnabar);
    border-radius: 999px;
    background: var(--cinnabar);
    color: #fff8ee;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.18s, transform 0.18s;
  }
  .hero-action:hover {
    background: #8f3025;
    transform: translateY(-1px);
  }

  /* ---------- flow strip ---------- */
  .flow-strip {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 22px 0 4px;
    padding: 12px 14px;
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    background: rgba(251, 248, 241, 0.66);
  }
  .flow-strip-label {
    margin-right: 4px;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--muted);
  }
  .flow-pill {
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper-2);
    font-size: 11px;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .flow-pill.accent {
    border-color: #dcb8ad;
    background: var(--cinnabar-soft);
    color: var(--cinnabar);
    font-weight: 500;
  }
  .flow-pill.muted { color: var(--muted); border-style: dashed; }
  .flow-arrow { color: #b8aa96; font-size: 12px; }
  .flow-arrow.dashed { color: var(--gold); }

  /* ---------- section head / grid ---------- */
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin: 30px 0 14px;
  }
  .section-head h3 {
    margin: 0;
    font-family: var(--serif);
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .section-head p {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    text-align: right;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(286px, 1fr));
    gap: 15px;
  }
  .syndrome-card {
    position: relative;
    padding: 19px 19px 15px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--paper-2);
    cursor: pointer;
    transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
    outline: none;
  }
  .syndrome-card:hover,
  .syndrome-card:focus-visible {
    transform: translateY(-3px);
    border-color: #cbb8a0;
    box-shadow: 0 14px 28px rgba(33, 29, 24, 0.09);
  }
  .syndrome-card:focus-visible { outline: 2px solid var(--cinnabar); outline-offset: 3px; }
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--cinnabar-soft);
    color: var(--cinnabar);
    font-size: 10px;
    letter-spacing: 0.04em;
  }
  .tag.jade { background: var(--jade-soft); color: var(--jade); }
  .tag.gold { background: var(--gold-soft); color: var(--gold); }
  .card-arrow {
    color: #b8aa96;
    font-size: 15px;
    transition: transform 0.18s, color 0.18s;
  }
  .syndrome-card:hover .card-arrow { transform: translateX(3px); color: var(--cinnabar); }
  .syndrome-card h4 {
    margin: 10px 0 6px;
    font-family: var(--serif);
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .card-symptoms {
    min-height: 44px;
    margin: 0;
    font-size: 12.5px;
    line-height: 1.72;
    color: var(--muted);
  }
  .card-method {
    margin-top: 12px;
    padding-top: 11px;
    border-top: 1px dashed var(--line-soft);
    font-size: 12.5px;
    line-height: 1.65;
    color: var(--ink-2);
  }
  .card-method span {
    margin-right: 6px;
    color: var(--jade);
    font-size: 10px;
    letter-spacing: 0.1em;
  }
  .card-herbs {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 12px;
  }
  .herb-chip {
    padding: 2px 7px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper);
    font-size: 11px;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .herb-chip.more { color: var(--muted); border-style: dashed; }
  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 13px;
    padding-top: 11px;
    border-top: 1px solid var(--line-soft);
    font-size: 10.5px;
    color: var(--muted);
  }
  .card-foot .ext { color: var(--gold); }
  .empty-state {
    grid-column: 1 / -1;
    padding: 44px 20px;
    border: 1px dashed var(--line);
    border-radius: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  /* ---------- detail ---------- */
  .detail-head {
    position: relative;
    overflow: hidden;
    padding: 28px 30px 24px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--paper-2);
    box-shadow: var(--shadow);
  }
  .detail-head::after {
    content: attr(data-mark);
    position: absolute;
    right: 30px;
    bottom: -18px;
    font-family: var(--serif);
    font-size: 92px;
    line-height: 1;
    color: rgba(166, 61, 47, 0.055);
    pointer-events: none;
  }
  .detail-head h2 {
    margin: 8px 0 8px;
    font-family: var(--serif);
    font-size: clamp(28px, 3.2vw, 40px);
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .detail-symptoms {
    max-width: 760px;
    margin: 0;
    font-size: 13.5px;
    line-height: 1.8;
    color: var(--ink-2);
  }
  .relation-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 20px;
  }
  .rel {
    padding: 5px 9px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper);
    font-size: 11px;
    color: var(--ink-2);
  }
  .rel.root { border-color: #dcb8ad; background: var(--cinnabar-soft); color: var(--cinnabar); }
  .rel.active { border-color: var(--cinnabar); background: var(--cinnabar); color: #fff; }
  .rel.muted { color: var(--muted); border-style: dashed; }
  .rel-arrow { color: #b8aa96; font-size: 11px; }

  .timeline {
    position: relative;
    margin-top: 24px;
    padding-left: 42px;
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 15px;
    top: 10px;
    bottom: 24px;
    width: 1px;
    background: var(--line);
  }
  .step {
    position: relative;
    margin-bottom: 18px;
  }
  .step-num {
    position: absolute;
    left: -42px;
    top: 0;
    width: 31px;
    height: 31px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--paper);
    color: var(--cinnabar);
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 600;
  }
  .step.focus .step-num {
    border-color: var(--cinnabar);
    background: var(--cinnabar);
    color: #fff;
  }
  .step-card {
    padding: 20px 22px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: var(--paper-2);
  }
  .step-card.plain {
    background: rgba(251, 248, 241, 0.56);
  }
  .step-label {
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--muted);
  }
  .step-label.accent { color: var(--cinnabar); }
  .step-label.jade { color: var(--jade); }
  .step-card h3 {
    margin: 6px 0 7px;
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 600;
    line-height: 1.45;
    letter-spacing: 0.03em;
  }
  .step-card p {
    margin: 0;
    font-size: 13px;
    line-height: 1.85;
    color: var(--ink-2);
  }
  .mini-note {
    margin-top: 12px;
    padding: 9px 11px;
    border-left: 2px solid var(--gold);
    background: var(--gold-soft);
    font-size: 11.5px;
    line-height: 1.7;
    color: #6b532b;
  }

  .herb-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
    gap: 9px;
    margin-top: 14px;
  }
  .herb-card {
    padding: 12px 13px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--paper);
    cursor: pointer;
    outline: none;
    transition: border-color 0.16s, background 0.16s, transform 0.16s;
  }
  .herb-card:hover,
  .herb-card:focus-visible {
    border-color: var(--cinnabar);
    background: #fffdf8;
    transform: translateY(-1px);
  }
  .herb-card:focus-visible { outline: 2px solid var(--cinnabar); outline-offset: 2px; }
  .herb-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .herb-name {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .role {
    flex: 0 0 auto;
    padding: 2px 6px;
    border-radius: 999px;
    font-size: 9.5px;
    letter-spacing: 0.04em;
  }
  .role.role-main { background: var(--cinnabar-soft); color: var(--cinnabar); }
  .role.role-common { background: var(--jade-soft); color: var(--jade); }
  .role.role-assist { background: var(--gold-soft); color: var(--gold); }
  .herb-nature {
    margin-top: 5px;
    font-size: 10.5px;
    line-height: 1.5;
    color: var(--muted);
  }
  .herb-effect {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin: 6px 0 0;
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--ink-2);
  }
  .herb-more {
    margin-top: 7px;
    font-size: 10px;
    color: var(--cinnabar);
  }

  .extension-note {
    margin: 12px 0 13px;
    padding: 9px 11px;
    border: 1px solid #e3d2b0;
    border-radius: 8px;
    background: var(--gold-soft);
    font-size: 11.5px;
    line-height: 1.7;
    color: #6b532b;
  }
  .formula-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
    gap: 9px;
  }
  .formula-card {
    padding: 12px 13px;
    border: 1px dashed #cdbb9f;
    border-radius: 9px;
    background: rgba(241, 231, 212, 0.28);
    cursor: pointer;
    outline: none;
    transition: border-color 0.16s, background 0.16s, transform 0.16s;
  }
  .formula-card:hover,
  .formula-card:focus-visible {
    border-color: var(--gold);
    background: var(--gold-soft);
    transform: translateY(-1px);
  }
  .formula-card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .formula-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .formula-name {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 600;
  }
  .ext-tag {
    padding: 1px 6px;
    border: 1px solid #d8c29c;
    border-radius: 999px;
    font-size: 9px;
    color: var(--gold);
    white-space: nowrap;
  }
  .formula-func {
    margin-top: 5px;
    font-size: 11px;
    line-height: 1.55;
    color: var(--cinnabar);
  }
  .formula-comp {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-top: 5px;
    font-size: 10.5px;
    line-height: 1.55;
    color: var(--muted);
  }

  /* ---------- drawer ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 18;
    background: rgba(33, 29, 24, 0.38);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    z-index: 20;
    width: min(440px, 94vw);
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--paper-2);
    border-left: 1px solid var(--line);
    box-shadow: -24px 0 60px rgba(33, 29, 24, 0.18);
    transform: translateX(102%);
    transition: transform 0.26s cubic-bezier(0.22, 0.8, 0.3, 1);
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 24px 24px 18px;
    border-bottom: 1px solid var(--line);
  }
  .drawer-kicker {
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--cinnabar);
  }
  .drawer-head h3 {
    margin: 6px 0 0;
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .close-btn {

      formulas: ["荆防败毒散", "仙方活命饮"]
    },
    {
      id: "yangxu-waigan",
      name: "阳虚外感",
      category: "虚人外感",
      symptoms: "恶寒重，发热轻，无汗，神疲欲寐，脉沉微。",
      pathogenesis: "阳气不足，外感风寒，正虚邪恋。",
      method: "助阳解表。",
      note: "辨证要点：恶寒重、脉沉微；麻黄配附子，助阳解表。",
      herbs: [
        { name: "麻黄", role: "首选" },
        { name: "细辛", role: "常用" },
        { name: "桂枝", role: "常用" },
        { name: "附子", role: "配伍" }
      ],
      formulas: ["麻黄附子细辛汤", "桂枝加附子汤"]
    },
    {
      id: "qixu-waigan",
      name: "气虚外感",
      category: "虚人外感",
      symptoms: "恶寒发热，自汗，倦怠乏力，气短，脉浮无力。",
      pathogenesis: "气虚卫外不固，外感风寒。",
      method: "益气解表。",
      note: "辨证要点：自汗、倦怠、脉浮无力；益气解表，不宜单纯发汗。",
      herbs: [
        { name: "黄芪", role: "配伍" },
        { name: "桂枝", role: "常用" },
        { name: "荆芥", role: "常用" },
        { name: "防风", role: "常用" },
        { name: "紫苏叶", role: "常用" }
      ],
      formulas: ["参苏饮", "玉屏风散"]
    }
  ]
};

const GROUP_ORDER = KG.groups;
const state = { currentId: null, query: "" };

const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));

const allHerbNames = new Set();
const allFormulaNames = new Set();
KG.syndromes.forEach((syndrome) => {
  syndrome.herbs.forEach((herb) => allHerbNames.add(herb.name));
  syndrome.formulas.forEach((formula) => allFormulaNames.add(formula));
});

function roleClass(role) {
  if (role === "首选") return "role-main";
  if (role === "常用") return "role-common";
  return "role-assist";
}

function matchesQuery(syndrome) {
  const query = state.query;
  if (!query) return true;
  return [
    syndrome.name,
    syndrome.category,
    syndrome.symptoms,
    syndrome.pathogenesis,
    syndrome.method,
    syndrome.note,
    ...syndrome.herbs.map((herb) => herb.name),
    ...syndrome.herbs.map((herb) => KG.herbs[herb.name] ? KG.herbs[herb.name].effects : ""),
    ...syndrome.formulas
  ].join(" ").includes(query);
}

function renderStats() {
  $("#stats").innerHTML = [
    `<span class="stat"><b>${KG.syndromes.length}</b>证类</span>`,
    `<span class="stat"><b>${allHerbNames.size}</b>味药</span>`,
    `<span class="stat"><b>${allFormulaNames.size}</b>首方</span>`
  ].join("");
}

function renderNav() {
  const nav = $("#syndromeNav");
  let html = `<button class="nav-item ${state.currentId === null ? "active" : ""}" data-nav="all">
    <span>谱系总览</span><span class="nav-count">${KG.syndromes.length}</span>
  </button>`;

  GROUP_ORDER.forEach((group) => {
    const syndromes = KG.syndromes.filter((syndrome) => syndrome.category === group && matchesQuery(syndrome));
    if (!syndromes.length) return;
    html += `<div class="nav-group"><div class="nav-group-title">${esc(group)}</div>`;
    syndromes.forEach((syndrome) => {
      html += `<button class="nav-item ${state.currentId === syndrome.id ? "active" : ""}" data-nav="${syndrome.id}">
        <span>${esc(syndrome.name)}</span><span class="nav-count">${syndrome.herbs.length}</span>
      </button>`;
    });
    html += `</div>`;
  });

  if (!html.includes("data-nav=\"") || (state.query && !KG.syndromes.some(matchesQuery))) {
    html += `<div class="nav-empty">没有匹配的证候。试试“风寒”“咽痛”“麻黄”或“鼻塞”。</div>`;
  }
  nav.innerHTML = html;
}

function cardHTML(syndrome) {
  const herbs = syndrome.herbs.slice(0, 4).map((herb) => `<span class="herb-chip">${esc(herb.name)}</span>`).join("");
  const more = syndrome.herbs.length > 4 ? `<span class="herb-chip more">+${syndrome.herbs.length - 4}</span>` : "";
  return `<article class="syndrome-card" data-open="${syndrome.id}" tabindex="0" role="button" aria-label="查看${esc(syndrome.name)}的理法方药链">
    <div class="card-top">
      <span class="tag ${syndrome.category === "风热表证" ? "jade" : syndrome.category === "虚人外感" ? "gold" : ""}">${esc(syndrome.category)}</span>
      <span class="card-arrow">→</span>
    </div>
    <h4>${esc(syndrome.name)}</h4>
    <p class="card-symptoms">${esc(syndrome.symptoms)}</p>
    <div class="card-method"><span>治法</span>${esc(syndrome.method)}</div>
    <div class="card-herbs">${herbs}${more}</div>
    <div class="card-foot"><span>${syndrome.herbs.length} 味药</span><span class="ext">${syndrome.formulas.length} 首方 · 拓展</span></div>
  </article>`;
}

function renderOverview() {
  $("#crumbName").textContent = "谱系总览";
  const syndromes = KG.syndromes.filter(matchesQuery);
  const cards = syndromes.length
    ? syndromes.map(cardHTML).join("")
    : `<div class="empty-state">没有匹配的证候。试试“风寒”“咽痛”“麻黄”或“鼻塞”。</div>`;

  $("#view").innerHTML = `
    <section class="hero">
      <div class="eyebrow">中药学 · 以证统药</div>
      <h2>表证：从证候到中药</h2>
      <p class="hero-lead">先辨表证，再明病机与治法，落到具体中药。方剂放在药物之后，作为配伍拓展，不要求先学方剂学。</p>
      <div class="hero-stats">
        <div class="hero-stat"><b>${KG.syndromes.length}</b><span>表证证类</span></div>
        <div class="hero-stat"><b>${allHerbNames.size}</b><span>涉及中药</span></div>
        <div class="hero-stat"><b>${allFormulaNames.size}</b><span>拓展方剂</span></div>
      </div>
      <button class="hero-action" data-open="fenghan-shishi">从风寒表实证看麻黄 <span>→</span></button>
    </section>

    <div class="flow-strip" aria-label="知识图谱阅读顺序">
      <span class="flow-strip-label">阅读顺序</span>
      <span class="flow-pill accent">表证</span><span class="flow-arrow">→</span>
      <span class="flow-pill">证类</span><span class="flow-arrow">→</span>
      <span class="flow-pill">理 · 病机</span><span class="flow-arrow">→</span>
      <span class="flow-pill">法 · 治法</span><span class="flow-arrow">→</span>
      <span class="flow-pill accent">药 · 中药</span><span class="flow-arrow dashed">⇢</span>
      <span class="flow-pill muted">方 · 拓展</span>
    </div>

    <div class="section-head">
      <h3>表证分型</h3>
      <p>${state.query ? `匹配 ${syndromes.length} 个证类` : "点击任一证类，进入理法方药链"}</p>
    </div>
    <div class="grid">${cards}</div>
  `;
}

function openHerb(name) {
  const herb = KG.herbs[name];
  if (!herb) return;
  const appearances = [];
  KG.syndromes.forEach((syndrome) => {
    syndrome.herbs.forEach((item) => {
      if (item.name === name) appearances.push({ syndrome: syndrome.name, role: item.role });
    });
  });
  const formulas = Object.keys(KG.formulas).filter((formulaName) => KG.formulas[formulaName].composition.includes(name));

  $("#drawerContent").innerHTML = `
    <div class="drawer-head">
      <div>
        <div class="drawer-kicker">中药 · 药性</div>
        <h3>${esc(name)}</h3>
      </div>
      <button class="close-btn" data-close aria-label="关闭">×</button>
    </div>
    <div class="drawer-body">
      <div class="field"><div class="field-label">性味</div><div class="field-value serif">${esc(herb.nature)}</div></div>
      <div class="field"><div class="field-label">归经</div><div class="field-value serif">${esc(herb.meridian)}</div></div>
      <div class="field"><div class="field-label">功效</div><div class="field-value">${esc(herb.effects)}</div></div>
      <div class="field"><div class="field-label">用量用法</div><div class="field-value">${esc(herb.usage)}</div></div>
      <div class="field"><div class="field-label">使用注意</div><div class="field-value">${esc(herb.caution)}</div></div>
      <div class="field"><div class="field-label">常见药对</div><div class="field-value">${esc(herb.pairs)}</div></div>
      <div class="field">
        <div class="field-label">在表证中的位置</div>
        <div class="chip-row">${appearances.map((item) => `<span class="chip cinnabar">${esc(item.syndrome)} · ${esc(item.role)}</span>`).join("")}</div>
      </div>
      <div class="field">
        <div class="field-label">见于方剂（拓展）</div>
        <div class="chip-row">${formulas.length ? formulas.map((formula) => `<span class="chip gold">${esc(formula)}</span>`).join("") : `<span class="chip">暂无</span>`}</div>
      </div>
      <div class="drawer-note">中药学阶段先掌握药性、功效与主治；方剂只作为“这味药在什么方中出现”的拓展线索，不要求掌握全方配伍。</div>
    </div>
  `;
  openDrawer();
}

function openFormula(name) {
  const formula = KG.formulas[name];
  if (!formula) return;
  const syndromes = KG.syndromes.filter((syndrome) => syndrome.formulas.includes(name));
  const herbs = Object.keys(KG.herbs).filter((herbName) => formula.composition.includes(herbName));

  $("#drawerContent").innerHTML = `
    <div class="drawer-head">
      <div>
        <div class="drawer-kicker">方剂 · 拓展</div>
        <h3>${esc(name)}</h3>
      </div>
      <button class="close-btn" data-close aria-label="关闭">×</button>
    </div>
    <div class="drawer-body">
      <div class="field"><div class="field-label">组成</div><div class="field-value">${esc(formula.composition)}</div></div>
      <div class="field"><div class="field-label">参考剂量 / 出处</div><div class="field-value">${esc(formula.dose)}</div></div>
      <div class="field"><div class="field-label">功用</div><div class="field-value serif">${esc(formula.function)}</div></div>
      <div class="field"><div class="field-label">主治</div><div class="field-value">${esc(formula.indication)}</div></div>
      <div class="field"><div class="field-label">方解 / 配伍要点</div><div class="field-value">${esc(formula.note)}</div></div>
      <div class="field">
        <div class="field-label">关联证候</div>
        <div class="chip-row">${syndromes.map((syndrome) => `<span class="chip cinnabar">${esc(syndrome.name)}</span>`).join("")}</div>
      </div>
      <div class="field">
        <div class="field-label">所含中药</div>
        <div class="chip-row">${herbs.length ? herbs.map((herb) => `<span class="chip">${esc(herb)}</span>`).join("") : `<span class="chip">见组成</span>`}</div>
      </div>
      <div class="drawer-note">方剂在本课程中是“药物的配伍语境”：看到药在方中的位置，帮助理解配伍，但不作为先修内容。</div>
    </div>
  `;
  openDrawer();
}

function openDrawer() {
  $("#drawer").classList.add("open");
  $("#drawer").setAttribute("aria-hidden", "false");
  $("#overlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeDrawer() {
  $("#drawer").classList.remove("open");
  $("#drawer").setAttribute("aria-hidden", "true");
  $("#overlay").classList.remove("open");
  document.body.style.overflow = "";
}

function renderDetail(id) {
  const syndrome = KG.syndromes.find((item) => item.id === id);
  if (!syndrome) { renderOverview(); return; }
  state.currentId = id;
  $("#crumbName").textContent = syndrome.name;

  const herbCards = syndrome.herbs.map((item) => {
    const herb = KG.herbs[item.name];
    return `<article class="herb-card" data-herb="${esc(item.name)}" tabindex="0" role="button" aria-label="查看${esc(item.name)}的药性">
      <div class="herb-card-top"><span class="herb-name">${esc(item.name)}</span><span class="role ${roleClass(item.role)}">${esc(item.role)}</span></div>
      <div class="herb-nature">${esc(herb.nature)} · ${esc(herb.meridian)}</div>
      <p class="herb-effect">${esc(herb.effects)}</p>
      <div class="herb-more">查看药性 →</div>
    </article>`;
  }).join("");

  const formulaCards = syndrome.formulas.map((name) => {
    const formula = KG.formulas[name];
    return `<article class="formula-card" data-formula="${esc(name)}" tabindex="0" role="button" aria-label="查看${esc(name)}的方剂信息">
      <div class="formula-card-top"><span class="formula-name">${esc(name)}</span><span class="ext-tag">拓展</span></div>
      <div class="formula-func">${esc(formula.function)}</div>
      <div class="formula-comp">${esc(formula.composition)}</div>
    </article>`;
  }).join("");

  $("#view").innerHTML = `
    <section class="detail-head" data-mark="${esc(syndrome.name.slice(0, 2))}">
      <div class="eyebrow">${esc(syndrome.category)} · 表证</div>
      <h2>${esc(syndrome.name)}</h2>
      <p class="detail-symptoms">${esc(syndrome.symptoms)}</p>
      <div class="relation-bar" aria-label="理法方药阅读顺序">
        <span class="rel root">表证</span><span class="rel-arrow">→</span>
        <span class="rel">证候</span><span class="rel-arrow">→</span>
        <span class="rel">理</span><span class="rel-arrow">→</span>
        <span class="rel">法</span><span class="rel-arrow">→</span>
        <span class="rel active">药</span><span class="rel-arrow">⇢</span>
        <span class="rel muted">方 · 拓展</span>
      </div>
    </section>

    <div class="timeline">
      <section class="step">
        <div class="step-num">1</div>
        <div class="step-card plain">
          <div class="step-label">证</div>
          <h3>辨证要点</h3>
          <p>${esc(syndrome.symptoms)}</p>
          <div class="mini-note">${esc(syndrome.note)}</div>
        </div>
      </section>
      <section class="step">
        <div class="step-num">2</div>
        <div class="step-card">
          <div class="step-label">理</div>
          <h3>病机</h3>
          <p>${esc(syndrome.pathogenesis)}</p>
        </div>
      </section>
      <section class="step">
        <div class="step-num">3</div>
        <div class="step-card">
          <div class="step-label jade">法</div>
          <h3>${esc(syndrome.method)}</h3>
          <p>治法由病机推出，是“证”与“药”之间的桥。</p>
        </div>
      </section>
      <section class="step focus">
        <div class="step-num">4</div>
        <div class="step-card">
          <div class="step-label accent">药 · 本课程重点</div>
          <h3>${syndrome.herbs.length} 味中药</h3>
          <p>先看药性、功效与主治，再点开单味药查看用量、注意和药对。</p>
          <div class="herb-grid">${herbCards}</div>
        </div>
      </section>
      <section class="step">
        <div class="step-num">5</div>
        <div class="step-card">
          <div class="step-label">方 · 拓展层</div>
          <h3>代表方剂</h3>
          <div class="extension-note">中药学阶段不要求先学方剂。先掌握药的主治与功效，再用方剂理解配伍。</div>
          <div class="formula-grid">${formulaCards}</div>
        </div>
      </section>
    </div>
  `;
}

function render() {
  renderNav();
  if (state.currentId === null) renderOverview();
  else renderDetail(state.currentId);
}

document.addEventListener("click", (event) => {
  const navItem = event.target.closest("[data-nav]");
  if (navItem) {
    const id = navItem.getAttribute("data-nav");
    state.currentId = id === "all" ? null : id;
    if (id === "all") renderOverview();
    else renderDetail(id);
    renderNav();
    return;
  }

  const opener = event.target.closest("[data-open]");
  if (opener) {
    const id = opener.getAttribute("data-open");
    state.currentId = id;
    renderDetail(id);
    renderNav();
    return;
  }

  const herbCard = event.target.closest("[data-herb]");
  if (herbCard) {
    openHerb(herbCard.getAttribute("data-herb"));
    return;
  }

  const formulaCard = event.target.closest("[data-formula]");
  if (formulaCard) {
    openFormula(formulaCard.getAttribute("data-formula"));
    return;
  }

  if (event.target.closest("[data-close]")) closeDrawer();
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeDrawer();
  if ((event.key === "Enter" || event.key === " ") && event.target.matches(".syndrome-card, .herb-card, .formula-card")) {
    event.preventDefault();
    event.target.click();
  }
});

$("#searchInput").addEventListener("input", (event) => {
  state.query = event.target.value.trim();
  renderNav();
  if (state.currentId === null) renderOverview();
});

renderStats();
render();
</script>
</body>
</html>
