<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>【模板】医案分析 · 理法方药进阶训练</title>
<style>
  :root{
    --paper:#F8F4EC; --paper-2:#FFFDF8; --ink:#2A2724; --ink-2:#6B6257; --ink-3:#9A8F80;
    --line:#E2D9CA; --zheng:#A63D40; --fa:#C1882B; --han:#2E6F5E; --re:#4A7C8C;
    --fang:#4C5680; --ok:#2E6F5E; --warn:#C1882B; --err:#A63D40;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(1100px 520px at 12% -8%, #FFFDF7 0%, rgba(255,253,247,0) 60%), var(--paper);
    color:var(--ink); line-height:1.7;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{height:100vh; display:flex; flex-direction:column; overflow:hidden;}
  header{
    flex:0 0 auto; padding:14px 26px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:16px; background:rgba(255,253,248,.72);
    backdrop-filter:blur(6px);
  }
  header h1{
    margin:0; font-size:18px; letter-spacing:2px; font-weight:700;
    font-family:"Songti SC","Noto Serif SC",serif;
  }
  header .sub{font-size:11px; color:var(--ink-3); letter-spacing:2px;}
  header .spacer{flex:1;}
  .link{
    font-size:12px; color:var(--ink-2); text-decoration:none;
    border:1px solid var(--line); border-radius:7px; padding:5px 11px; background:var(--paper-2);
  }
  .link:hover{border-color:#D3C4AC; color:var(--zheng);}

  .body{flex:1; display:grid; grid-template-columns:minmax(0,0.86fr) minmax(0,1.14fr); overflow:hidden;}
  @media (max-width:1000px){
    .body{grid-template-columns:1fr; grid-template-rows:auto 1fr; overflow:auto;}
    .app{height:auto; min-height:100vh; overflow:auto;}
  }

  /* 左：病案 */
  .case{
    border-right:1px solid var(--line); padding:24px 26px; overflow-y:auto;
    background:linear-gradient(180deg,rgba(255,253,248,.75),rgba(255,253,248,0));
  }
  .case .kicker{font-size:10.5px; letter-spacing:3px; color:var(--ink-3); margin-bottom:8px;}
  .case h2{
    margin:0 0 4px; font-size:20px; font-family:"Songti SC","Noto Serif SC",serif; letter-spacing:1px;
  }
  .case .src{font-size:11.5px; color:var(--ink-3); margin-bottom:16px;}
  .case .text{
    font-family:"Songti SC","Noto Serif SC","SimSun",serif;
    font-size:15.5px; line-height:2.1; text-align:justify; color:#332F2A;
    background:var(--paper-2); border:1px solid var(--line); border-radius:10px;
    padding:18px 20px; margin-bottom:16px;
  }
  .case .text em{font-style:normal; background:linear-gradient(transparent 62%, #F3E3C8 62%);}
  .case .meta{display:flex; gap:8px; flex-wrap:wrap;}
  .case .meta span{font-size:11px; color:var(--ink-2); background:#F1EADF; border-radius:5px; padding:2px 9px;}
  .case .hint{
    margin-top:18px; font-size:12.5px; color:var(--ink-2); border-left:3px solid #E3D5BC;
    padding:2px 0 2px 12px;
  }
  .case-tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .case-tabs button{
    font:inherit; font-size:12px; cursor:pointer; border:1px solid var(--line);
    background:var(--paper-2); color:var(--ink-2); border-radius:7px; padding:5px 12px;
  }
  .case-tabs button.on{background:var(--ink); color:#fff; border-color:var(--ink);}

  /* 右：工作区 */
  .work{display:flex; flex-direction:column; overflow:hidden; min-width:0;}
  .steps{
    flex:0 0 auto; display:flex; gap:6px; padding:14px 22px 0; flex-wrap:wrap;
  }
  .steps .s{
    font-size:11.5px; color:var(--ink-3); border:1px solid var(--line); background:var(--paper-2);
    border-radius:20px; padding:4px 12px; white-space:nowrap;
  }
  .steps .s.done{color:var(--ok); border-color:#CBDDD2; background:#F0F5F1;}
  .steps .s.cur{color:#fff; background:var(--zheng); border-color:var(--zheng);}
  .panel{flex:1; overflow-y:auto; padding:18px 22px 8px;}
  .panel h3{
    margin:2px 0 4px; font-size:16px; font-family:"Songti SC","Noto Serif SC",serif; letter-spacing:1px;
  }
  .panel .desc{font-size:12.5px; color:var(--ink-2); margin:0 0 14px;}
  .grp{margin-bottom:18px;}
  .grp .lbl{font-size:12px; color:var(--ink-3); margin-bottom:7px; letter-spacing:1px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    font:inherit; font-size:13px; cursor:pointer; user-select:none;
    border:1px solid var(--line); background:var(--paper-2); color:var(--ink-2);
    border-radius:8px; padding:6px 13px; transition:.15s;
  }
  .chip:hover{border-color:#D3C4AC; color:var(--ink);}
  .chip.on{background:#FBEDE6; border-color:#E0B3A4; color:var(--zheng); font-weight:600;}
  .chip.on.blue{background:#E9F0F3; border-color:#A9C4CE; color:var(--re);}
  .done .chip{pointer-events:none;}

  .herbs{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:8px;}
  .herb{
    font:inherit; font-size:13px; cursor:pointer; text-align:center;
    border:1px solid var(--line); background:var(--paper-2); color:var(--ink-2);
    border-radius:8px; padding:8px 6px; transition:.15s; position:relative;
  }
  .herb:hover{border-color:#D3C4AC; color:var(--ink);}
  .herb.on{background:#F0F5F1; border-color:#B9D2C4; color:#245A4C; font-weight:600;}
  .herb .mk{position:absolute; top:-7px; right:-6px; font-size:10px; background:var(--ok); color:#fff;
    border-radius:10px; padding:1px 6px;}

  /* 自由作答 */
  .free{
    width:100%; min-height:118px; resize:vertical; display:block;
    font:inherit; font-size:14px; line-height:1.95;
    border:1px solid var(--line); border-radius:10px; padding:12px 14px;
    background:var(--paper-2); color:var(--ink);
  }
  .free:focus{outline:none; border-color:#C9B99E; box-shadow:0 0 0 3px rgba(193,136,43,.09);}
  .free::placeholder{color:var(--ink-3);}
  .frow{display:flex; align-items:center; gap:12px; margin-top:11px; flex-wrap:wrap;}
  .frow .cnt{font-size:12px; color:var(--ink-3);}
  .tag{font-size:12px; border-radius:6px; padding:2px 9px; border:1px solid;}
  .tag.ok{background:#F0F5F1; border-color:#CBDDD2; color:#245A4C;}
  .tag.bad{background:#FBEDE6; border-color:#E0B3A4; color:#8A2F32;}
  .fback{margin-top:14px;}
  .fback .lbl{font-size:11.5px; color:var(--ink-3); margin-bottom:7px; letter-spacing:1px;}
  .hintbox{
    margin-top:14px; background:#FBF4E4; border:1px solid #EBD9B4;
    border-left:3px solid var(--fa); border-radius:10px; padding:12px 15px;
  }
  .hintbox .lbl{font-size:11.5px; color:#8A6B22; letter-spacing:1px; margin-bottom:5px;}
  .hintbox p{margin:0; font-size:13px; color:#5C4A1E; line-height:1.95;}
  .hintbox.done{background:#F0F5F1; border-color:#CBDDD2; border-left-color:var(--ok);}
  .hintbox.done p{color:#245A4C;}
  .btn.small{font-size:12px; padding:4px 12px; margin-top:10px;}

  .locked .chip,.locked .herb{pointer-events:none;}

  .actions{
    flex:0 0 auto; display:flex; gap:10px; align-items:center;
    padding:14px 22px; border-top:1px solid var(--line); background:rgba(255,253,248,.72);
  }
  .btn{
    font:inherit; font-size:13px; font-weight:600; cursor:pointer; border-radius:8px;
    padding:8px 18px; border:1px solid var(--line); background:var(--paper-2); color:var(--ink-2);
  }
  .btn:hover{border-color:#C9B99E; color:var(--ink);}
  .btn.primary{background:var(--zheng); border-color:var(--zheng); color:#fff;}
  .btn.primary:hover{background:#943538;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .actions .spacer{flex:1;}
  .actions .cnt{font-size:12px; color:var(--ink-3);}

  /* 结果 */
  .score{display:flex; align-items:center; gap:20px; background:var(--paper-2);
    border:1px solid var(--line); border-radius:12px; padding:16px 20px; margin-bottom:16px;}
  .score .num{font-size:38px; font-weight:700; color:var(--zheng); line-height:1;
    font-family:"Songti SC","Noto Serif SC",serif;}
  .score .num small{font-size:13px; color:var(--ink-3); font-weight:400;}
  .score .bars{flex:1; display:grid; gap:6px;}
  .bar{display:grid; grid-template-columns:74px 1fr 46px; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-2);}
  .bar .tr{height:6px; background:#EDE4D6; border-radius:4px; overflow:hidden;}
  .bar .fl{height:100%; background:var(--han); border-radius:4px;}
  .fb{list-style:none; margin:0 0 18px; padding:0; display:grid; gap:7px;}
  .fb li{font-size:12.5px; padding:7px 12px; border-radius:7px; border-left:3px solid;}
  .fb li.ok{background:#F0F5F1; border-color:var(--ok); color:#245A4C;}
  .fb li.warn{background:#FBF4E4; border-color:var(--warn); color:#7A5A18;}
  .fb li.err{background:#FBEDE6; border-color:var(--err); color:#8A2F32;}
  .ref{background:var(--paper-2); border:1px solid var(--line); border-radius:12px; padding:18px 20px;}
  .ref h4{margin:0 0 8px; font-size:13.5px; color:var(--zheng); letter-spacing:1px;}
  .ref h4:not(:first-child){margin-top:18px;}
  .ref p{margin:0 0 8px; font-size:13px; color:#3A352F; line-height:1.9;}
  .ref table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:4px;}
  .ref th,.ref td{border:1px solid var(--line); padding:6px 9px; text-align:left;}
  .ref th{background:#F4EDE1; color:var(--ink-2); font-weight:600; width:70px;}
  .ref .kw{color:var(--zheng); font-weight:600;}

  /* 答题码 */
  .codebox{margin:0 0 16px; background:#F0F5F1; border:1px solid #CBDDD2; border-radius:12px; padding:14px 16px;}
  .codebox .lbl{font-size:12px; letter-spacing:1px; color:#245A4C; margin-bottom:8px; font-weight:600;}
  .codebox textarea{
    width:100%; height:64px; resize:vertical; word-break:break-all;
    font:12px/1.7 ui-monospace,Menlo,Consolas,monospace;
    border:1px solid #CBDDD2; border-radius:8px; padding:8px 10px;
    background:#fff; color:#245A4C;
  }
  .codebox .row{display:flex; gap:12px; align-items:center; margin-top:9px; flex-wrap:wrap;}
  .codebox .tip{font-size:11.5px; color:var(--ink-2);}

  /* 教师汇总 */
  .modal{position:fixed; inset:0; background:rgba(42,39,36,.46); display:none; z-index:60; padding:26px; overflow:auto;}
  .modal.on{display:block;}
  .modal-box{
    width:min(880px,100%); margin:0 auto; background:var(--paper-2);
    border:1px solid var(--line); border-radius:14px; padding:22px 24px;
    box-shadow:0 22px 60px rgba(0,0,0,.24);
  }
  .modal-box h3{margin:0 0 4px; font-size:17px; font-family:"Songti SC","Noto Serif SC",serif; letter-spacing:1px;}
  .modal-box .desc{font-size:12.5px; color:var(--ink-2); margin:0 0 12px;}
  .modal-box textarea{
    width:100%; height:104px; resize:vertical; word-break:break-all;
    font:12px/1.7 ui-monospace,Menlo,Consolas,monospace;
    border:1px solid var(--line); border-radius:8px; padding:9px 11px; background:#fff; color:var(--ink);
  }
  .modal-box .row{display:flex; gap:10px; align-items:center; margin:12px 0 4px; flex-wrap:wrap;}
  .tstat{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:10px; margin:16px 0;}
  .tstat .k{background:#F4EDE1; border-radius:10px; padding:10px 12px;}
  .tstat .k b{display:block; font-size:21px; color:var(--zheng); line-height:1.2; font-family:"Songti SC","Noto Serif SC",serif;}
  .tstat .k span{font-size:11.5px; color:var(--ink-2);}
  .tbl{width:100%; border-collapse:collapse; font-size:12px; margin-bottom:16px;}
  .tbl th,.tbl td{border:1px solid var(--line); padding:5px 9px; text-align:left;}
  .tbl th{background:#F4EDE1; color:var(--ink-2); font-weight:600;}
  .tbl td.n{width:76px; text-align:right; font-variant-numeric:tabular-nums;}
  .tbl .hot{color:var(--zheng); font-weight:600;}
  .tbl .cold{color:var(--ink-3);}

  details.tpl{margin-top:16px; font-size:12.5px; color:var(--ink-2);}
  details.tpl summary{cursor:pointer; color:var(--ink-2); font-size:12px;}
  details.tpl pre{
    background:#FBF7EF; border:1px solid var(--line); border-radius:8px; padding:12px;
    overflow:auto; font-size:11.5px; line-height:1.65; color:#3C3832;
  }
  .placeholder{color:var(--ink-3); font-size:13px; padding:20px 0;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>医案分析 · 理法方药进阶训练</h1>
      <div class="sub">读真实病案 · 析病机 · 定治法 · 选药配伍</div>
    </div>
    <div class="spacer"></div>
    <button class="link" id="tEntry" data-a="teach" hidden>教师汇总</button>
    <a class="link" href="辨证练习器.html">← 初级训练</a>
  </header>

  <div class="body">
    <section class="case" id="casePane"></section>
    <section class="work">
      <div class="steps" id="steps"></div>
      <div class="panel" id="panel"></div>
      <div class="actions" id="actions"></div>
    </section>
  </div>
</div>

<div class="modal" id="tModal">
  <div class="modal-box">
    <h3>教师汇总 · 粘贴学生答题码</h3>
    <p class="desc">每行一个答题码（也支持空格、逗号分隔）。仅统计本案的答题码，格式不符的会被忽略。</p>
    <textarea id="tIn" placeholder="TCM1.xxxxxxx.0ab&#10;TCM1.yyyyyyy.12z"></textarea>
    <div class="row">
      <button class="btn primary" data-a="tstat">统计</button>
      <button class="btn" data-a="tcsv">导出 CSV</button>
      <button class="btn" data-a="tclear">清空</button>
      <span class="spacer" style="flex:1"></span>
      <button class="btn" data-a="tclose">关闭</button>
    </div>
    <div id="tOut" class="placeholder">粘贴答题码后点击「统计」。</div>
  </div>
</div>

<script>
(function () {
  "use strict";
/* ============================================================
   医案分析 · 理法方药进阶训练（通用模板）
   用法：复制到 ./<章节名>/医案分析器.html，在 ADV 中追加本章医案。
   字段：
     text     病案原文（只放四诊资料，不要写辨证结论与处方，否则提前泄底）
     kp       自由作答的判分要点，每组同义词命中任一即算答到
              { sx:[{n:"要点名", k:["同义词1","同义词2"]}, ...], bj:[...], zf:[...] }
     kpBad    写错方向才扣分（原文没有的信息 / 辨证相反）
              { sx:[{n:"汗出", k:["汗出"]}, ...], bj:[...], zf:[...] }
     hint     逐层提示，只说往哪看，不给答案；每题 3 条
              { sx:["提示1","提示2","提示3"], bj:[...], zf:[...] }
     pool     可选药物 id 数组            10–14 味，含 4 味以上禁忌药
     need     必选药 {id:{w}}             仅计权重，不区分君臣佐使
     ok       可用非首选 {id:{w}}         bad 性味相悖 {id:{why}}
     pairs    药对数组（推荐，可考多组配伍）
              [{opts:[[a,b]], ans:"a|b", rel:"相须", relOpts:[...], meaning:"..."}]
              单个药对可写 pair:{}，引擎自动兼容
     analysis 参考答案 {bj, zf, xuanyao, diff, orig}
              herb:{n,t,g,rows:[[功效,本案对应,配伍]]}  // 可选：围绕某味药展开
   评分：四诊 20 + 病机 25 + 治法 15 + 选药 25 + 配伍 15 = 100
   作答：前三步手写（不再点选），点「检查一下」只提示方向，不直接给答案；
        写入原文没有的信息或辨证相反会扣分。
   答题码：学生提交后生成 TCM1.xxx.xxx；教师用 ?t=1 打开「教师汇总」粘贴统计
   ★ 换章节时同步替换 HERB 药物表；配伍 15 分在多个药对间均分。
   ============================================================ */

  /* ============================================================
     数据区：新增医案只需在 ADV 中追加一个对象
     need : 必选药 { id:{w:权重} }
     ok   : 可用但不首选 { id:{w:权重} }
     bad  : 性味/功效相悖 { id:{why:"原因"} }
     pair : 核心药对 { opts:[["a","b"],...], ans:"a|b", rel:"相须", relOpts:[...], meaning:"..." }
     ============================================================ */

  var HERB = {
    mah:{n:"麻黄", t:"辛、微苦，温。归肺、膀胱经"},
    gui:{n:"桂枝", t:"辛、甘，温。归心、肺、膀胱经"},
    jing:{n:"荆芥", t:"辛，微温。归肺、肝经"},
    fang:{n:"防风", t:"辛、甘，微温。归膀胱、肝、脾经"},
    qiang:{n:"羌活", t:"辛、苦，温。归膀胱、肾经"},
    bai:{n:"白芷", t:"辛，温。归胃、大肠、肺经"},
    xi:{n:"细辛", t:"辛，温。归心、肺、肾经"},
    sheng:{n:"生姜", t:"辛，微温。归肺、脾、胃经"},
    bo:{n:"薄荷", t:"辛，凉。归肺、肝经"},
    nbz:{n:"牛蒡子", t:"辛、苦，寒。归肺、胃经"},
    sy:{n:"桑叶", t:"甘、苦，寒。归肺、肝经"},
    jh:{n:"菊花", t:"甘、苦，微寒。归肺、肝经"},
    gg:{n:"葛根", t:"甘、辛，凉。归脾、胃、肺经"},
    chai:{n:"柴胡", t:"辛、苦，微寒。归肝、胆、肺经"},
    dan:{n:"淡豆豉", t:"苦、辛，凉。归肺、胃经"},
    xing:{n:"苦杏仁", t:"苦，微温；有小毒。归肺、大肠经"},
    su:{n:"紫苏叶", t:"辛，温。归肺、脾经"}
  };

  var ADV = [
    {
      id:"a1",
      title:"涉水感寒水肿案",
      src:"真实验案 · 1984-02-15 · 麻黄汤加味",
      text:"吴某，男，36岁，1984年2月15日就诊。患者以捕鱼虾为生，经常涉水淋雨。三日前突然畏冷发热，无汗，咳嗽声重，痰白而稀，脸面浮肿，小便不利，而延余诊治。脉浮，舌苔薄白。",
      meta:["男 · 36岁","1984年2月","病程 3 日","职业：捕鱼虾"],
      hint:"先看起病与诱因，再看寒热、汗之有无；最后注意：咳嗽与水肿为何同时出现？病位在何处？",
      /* 自由作答：每个要点给一组同义词，命中任一即算答到 */
      kp:{
        sx:[
          {n:"恶寒（畏冷）", k:["恶寒","畏冷","怕冷","恶风","发冷","寒战"]},
          {n:"发热", k:["发热","身热","发烧","体温升高"]},
          {n:"无汗", k:["无汗","不出汗","汗不出"]},
          {n:"咳嗽", k:["咳嗽","咳"]},
          {n:"痰白而稀", k:["痰白","白痰","痰稀","稀痰"]},
          {n:"脸面浮肿", k:["浮肿","水肿","面肿","脸肿","目胞肿"]},
          {n:"小便不利", k:["小便不利","小便少","尿少","小便短少","排尿不畅","溺少"]},
          {n:"脉浮", k:["脉浮","浮脉"]},
          {n:"苔薄白", k:["薄白","苔白"]}
        ],
        bj:[
          {n:"风寒袭表", k:["风寒","寒邪","表寒","风寒束表","外感风寒","表证"]},
          {n:"肺气郁闭、失于宣降", k:["肺气不宣","肺失宣降","肺气郁闭","肺气闭","宣降失常","肺气壅","肺失清肃"]},

  var state = { ci:0, step:0, free:{sx:"",bj:"",zf:""}, hintLv:{sx:0,bj:0,zf:0}, checked:{}, herbs:{}, pair:{}, rel:{}, done:false, score:null, t0:Date.now() };

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); };

  function cur(){ return ADV[state.ci]; }
  function pairsOf(c){ return c.pairs || [c.pair]; }

  /* ---------- 自由作答的判分与提示 ---------- */
  var FREE_MAX = {sx:20, bj:25, zf:15};
  var FREE_NAME = {sx:"四诊", bj:"病机", zf:"治法"};
  var FREE_KIND = ["sx","bj","zf"];

  function norm(s){
    return String(s || "").toLowerCase().replace(/[\s，,。、；;：:（）()【】\[\]"'“”‘’？！!?.]/g, "");
  }

  // 命中同义词；紧贴"不/无/未/非/没"或"没有/未见"时不算（如"无汗"不算"汗出"）
  function hitKey(text, k){
    var NEG2 = ["没有", "并无", "未见", "未闻", "不伴", "不发"];
    for (var i = 0; i < k.length; i++){
      var w = norm(k[i]), idx = text.indexOf(w);
      while (idx >= 0){
        var p1 = text.charAt(idx - 1), p2 = text.slice(Math.max(0, idx - 2), idx);
        if (!/[不无未非没]/.test(p1) && NEG2.indexOf(p2) < 0) return true;
        idx = text.indexOf(w, idx + w.length);
      }
    }
    return false;
  }

  function freeHits(kind){
    var t = norm(state.free[kind]), hits = [];
    cur().kp[kind].forEach(function(p, i){ if (hitKey(t, p.k)) hits.push(i); });
    return hits;
  }

  function freeBads(kind){
    var t = norm(state.free[kind]), out = [];
    (cur().kpBad[kind] || []).forEach(function(p){ if (hitKey(t, p.k)) out.push(p.n); });
    return out;
  }

  function freeScore(kind){
    var pts = cur().kp[kind], per = FREE_MAX[kind] / pts.length;
    var hits = freeHits(kind), bads = freeBads(kind);
    return {
      kind:kind, hits:hits, bads:bads, total:pts.length, max:FREE_MAX[kind],
      score: Math.max(0, hits.length * per - bads.length * per)
    };
  }

  function reset(ci){
    state.ci = ci; state.step = 0;
    state.free = {sx:"", bj:"", zf:""};
    state.hintLv = {sx:0, bj:0, zf:0};
    state.checked = {};
    state.herbs = {}; state.pair = {}; state.rel = {};
    state.done = false; state.score = null;
    state.t0 = Date.now();
    renderCase(); renderAll();
  }

  function renderCase(){
    var c = cur();
    var tabs = ADV.length > 1 ? ADV.map(function(x,i){
      return '<button data-ci="'+i+'" class="'+(i===state.ci?'on':'')+'">'+x.title+'</button>';
    }).join("") : "";
    $("casePane").innerHTML =
      '<div class="kicker">医 案 原 文</div>' +
      (tabs ? '<div class="case-tabs">'+tabs+'</div>' : "") +
      '<h2>'+c.title+'</h2>' +
      '<div class="src">'+c.src+'</div>' +
      '<div class="text">'+c.text+'</div>' +
      '<div class="meta">'+c.meta.map(function(m){return '<span>'+m+'</span>';}).join("")+'</div>' +
      '<div class="hint">'+c.hint+'</div>';
  }

  var STEPS = ["① 四诊", "② 病因病机", "③ 治法", "④ 选用", "⑤ 配伍意义"];

  function renderSteps(){
    $("steps").innerHTML = STEPS.map(function(t,i){
      var cls = i === state.step ? "cur" : (i < state.step ? "done" : "");
      return '<span class="s '+cls+'">'+t+'</span>';
    }).join("");
  }

  function renderAll(){
    renderSteps();
    if (state.done) { renderResult(); } else { renderPanel(); renderActions(); }
  }

  /* ---------- 各步骤面板 ---------- */
  function renderPanel(){
    var c = cur(), p = "";
    if (state.step < 3){
      var kind = FREE_KIND[state.step];

        "读原文，把属于四诊（望、闻、问、切）的资料提取出来。用词或短句都行，<b>不要写原文里没有的内容</b>。",
        "用自己的话写病机：邪从何来、病位何在、脏腑功能怎样失调。写不准没关系，点「检查一下」可以要提示。",
        "治法由病机推出，须与病性（寒热）、病位（表里）相符。写出你的治法，不必照抄课本原句。"

              : '写完点「检查一下」，它会指出还缺哪一类，但不会直接给答案')+'</span></div>';

               '</div>';
        } else {
          p += '<div class="hintbox done"><p>要点齐了，可以进入下一步。</p></div>';

    }
    if (state.step === 3){
      var n = Object.keys(state.herbs).length;
      p += '<h3>第四步 · 选用</h3>';
      p += '<p class="desc">围绕病机与治法，从本章药物中选出 2–5 味组成处方。只选<b>与病性相符、能切中病机</b>的药。</p>';
      p += '<div class="grp"><div class="herbs">' + c.pool.map(function(id){
        var on = !!state.herbs[id];
        return '<button class="herb '+(on?'on':'')+'" data-hb="'+id+'">'+HERB[id].n+
               (on?'<span class="mk">✓</span>':'')+'</button>';
      }).join("") + '</div></div>';
      p += '<div class="grp" style="margin-top:14px"><div class="lbl">当前已选 '+n+' / 5 味</div></div>';
    }
    if (state.step === 4){
      var prs = pairsOf(c);
      p += '<h3>第五步 · 配伍意义</h3>';
      p += '<p class="desc">方中药物不是简单堆叠。逐一判断<b>核心药对</b>及其<b>配伍关系</b>。</p>';
      prs.forEach(function(pr, i){
        p += '<div class="grp"><div class="lbl">'+(prs.length>1 ? ("药对 "+(i+1)+" / "+prs.length) : "本案核心药对")+'</div><div class="chips">' + pr.opts.map(function(o){
          var k = o[0]+"|"+o[1];
          return '<button class="chip '+(state.pair[i]===k?'on':'')+'" data-pair="'+i+':'+k+'">'+HERB[o[0]].n+' + '+HERB[o[1]].n+'</button>';
        }).join("") + '</div></div>';
        p += '<div class="grp"><div class="lbl">二者的配伍关系</div><div class="chips">' + pr.relOpts.map(function(r){
          return '<button class="chip blue '+(state.rel[i]===r?'on':'')+'" data-rel="'+i+':'+r+'">'+r+'</button>';
        }).join("") + '</div></div>';
      });
      p += '<div class="grp"><div class="lbl" style="color:var(--ink-3)">提示：相须—性能功效相似，协同增效；相使—一药为主、另一药为辅以提高主药疗效；相畏—一药毒性被另一药减轻；相杀—一药消除另一药毒性；相反—合用产生毒副作用。</div></div>';
    }
    $("panel").innerHTML = p;
    $("panel").scrollTop = 0;

  function renderActions(){
    var c = cur(), canNext = true, msg = "";
    if (state.step < 3){
      var kind0 = FREE_KIND[state.step];
      if ((state.free[kind0] || "").trim().length < 4) { canNext = false; msg = "先写下你的"+FREE_NAME[kind0]+"判断"; }
      else if (!freeHits(kind0).length) { canNext = false; msg = "还没写到要点，点「检查一下」看看提示"; }
    }
    if (state.step === 3){
      if (Object.keys(state.herbs).length < 2) { canNext = false; msg = "至少选 2 味药"; }
    }
    if (state.step === 4){
      pairsOf(c).forEach(function(pr, i){ if (!state.pair[i] || !state.rel[i]) canNext = false; });
      if (!canNext) msg = "请完成全部药对与配伍关系";
    }

    var last = state.step === STEPS.length - 1;
    $("actions").innerHTML =
      '<button class="btn" data-a="prev" '+(state.step===0?'disabled':'')+'>上一步</button>'+
      '<span class="cnt">'+(msg || (last ? "完成后提交，系统将逐项讲评" : "第 " + (state.step+1) + " / 5 步"))+'</span>'+
      '<span class="spacer"></span>'+
      (last
        ? '<button class="btn primary" data-a="submit">提交分析</button>'
        : '<button class="btn primary" data-a="next" '+(canNext?'':'disabled')+'>下一步</button>');
  }

  /* ---------- 评分 ---------- */
  function computeScore(){
    var c = cur(), s = {}, fb = [];

    // 四诊 20（自由作答，命中要点得分，写入原文没有的信息扣分）
    var fxs = freeScore("sx");
    s.sx = fxs.score;
    var missSx = c.kp.sx.filter(function(p, i){ return fxs.hits.indexOf(i) < 0; });
    if (missSx.length) fb.push({t:"warn", x:"四诊未写到："+missSx.map(function(p){return p.n;}).join("、")});
    if (fxs.bads.length) fb.push({t:"err", x:"读案有误（原文没有或与病性相反）："+fxs.bads.join("、")});
    if (!missSx.length && !fxs.bads.length) fb.push({t:"ok", x:"四诊采集完整、无冗余"});

    // 病机 25
    var fbj = freeScore("bj");
    s.bj = fbj.score;
    var missB = c.kp.bj.filter(function(p, i){ return fbj.hits.indexOf(i) < 0; });
    if (missB.length) fb.push({t:"warn", x:"病机未写到："+missB.map(function(p){return p.n;}).join("、")});
    if (fbj.bads.length) fb.push({t:"err", x:"辨证方向有误："+fbj.bads.join("、")+
      (fbj.bads.indexOf("风热") >= 0 ? "——痰白稀、苔薄白、口不渴，全无热象" : "")});
    if (!missB.length && !fbj.bads.length) fb.push({t:"ok", x:"病机分析准确"});

    // 治法 15
    var fzf = freeScore("zf");
    s.zf = fzf.score;
    var missZ = c.kp.zf.filter(function(p, i){ return fzf.hits.indexOf(i) < 0; });
    if (missZ.length) fb.push({t:"warn", x:"治法未写到："+missZ.map(function(p){return p.n;}).join("、")});
    if (fzf.bads.length) fb.push({t:"err", x:"治法方向有误："+fzf.bads.join("、")});
    if (!missZ.length && !fzf.bads.length) fb.push({t:"ok", x:"治法与病机相符"});

    // 选药 25
    var needW = 0, got = 0;
    Object.keys(c.need).forEach(function(id){ needW += c.need[id].w; });
    var chosen = Object.keys(state.herbs);
    chosen.forEach(function(id){
      if (c.need[id]) got += c.need[id].w;
      else if (c.ok[id]) got += c.ok[id].w * 0.5;
      else if (c.bad[id]) got -= 1.5;
    });
    s.herb = Math.min(25, Math.max(0, got / needW) * 25);
    var missH = Object.keys(c.need).filter(function(id){ return !state.herbs[id]; });
    if (missH.length) fb.push({t:"warn", x:"核心药物未选："+missH.map(function(id){return HERB[id].n;}).join("、")});
    chosen.forEach(function(id){
      if (c.bad[id]) fb.push({t:"err", x:HERB[id].n+"："+c.bad[id].why});
    });
    if (!missH.length && !chosen.some(function(id){return !!c.bad[id];})) fb.push({t:"ok", x:"选药方向正确"});

    // 配伍 15（多药对均分）
    var prs = pairsOf(c), pw = 15 / prs.length;
    s.pair = 0;
    prs.forEach(function(pr, i){
      var pairOk = state.pair[i] === pr.ans, relOk = state.rel[i] === pr.rel;
      s.pair += (pairOk ? pw * 7 / 15 : 0) + (relOk ? pw * 8 / 15 : 0);
      var label = pr.ans.split("|").map(function(id){ return HERB[id].n; }).join(" + ");
      if (pairOk && relOk) fb.push({t:"ok", x:"药对「"+label+"」与「"+pr.rel+"」判断正确"});
      else {
        if (!pairOk) fb.push({t:"err", x:"核心药对应为「"+label+"」"});
        if (!relOk) fb.push({t:"err", x:"「"+label+"」的配伍关系应为「"+pr.rel+"」"});
      }
    });

    var total = Math.round(s.sx + s.bj + s.zf + s.herb + s.pair);
    return { total: total, s: s, fb: fb };
  }

  /* ---------- 答题码：TCM1.<base64url(JSON)>.<校验> ---------- */
  function chk3(s){
    var n = 0;
    for (var i = 0; i < s.length; i++) n = (n * 31 + s.charCodeAt(i)) % 46656;
    return ("00" + n.toString(36)).slice(-3);
  }

  function maskOf(hits){
    var m = 0;
    hits.forEach(function(i){ m |= (1 << i); });
    return m;
  }

  function encodeCode(){
    var c = cur(), r = state.score, prs = pairsOf(c);
    var fxs = freeScore("sx"), fbj = freeScore("bj"), fzf = freeScore("zf");
    var payload = {
      v:2, c:c.id, s:r.total,
      a:[Math.round(r.s.sx), Math.round(r.s.bj), Math.round(r.s.zf), Math.round(r.s.herb), Math.round(r.s.pair)],
      m:[maskOf(fxs.hits), maskOf(fbj.hits), maskOf(fzf.hits)],
      e:[fxs.bads.length, fbj.bads.length, fzf.bads.length],
      h:Object.keys(state.herbs).sort().join(","),
      q:prs.map(function(pr, i){
        var oi = -1, ri = -1;
        pr.opts.forEach(function(o, k){ if (o[0] + "|" + o[1] === state.pair[i]) oi = k; });
        pr.relOpts.forEach(function(x, k){ if (x === state.rel[i]) ri = k; });
        return oi + ":" + ri;
      }).join(";"),
      t:Math.max(0, Math.round((Date.now() - state.t0) / 1000))
    };
    var b64 = btoa(JSON.stringify(payload)).replace(/=+$/, "").replace(/\+/g, "-").replace(/\//g, "_");
    return "TCM1." + b64 + "." + chk3(b64);
  }

  function decodeCode(str){
    var m = String(str).trim().split(".");
    if (m.length !== 3 || m[0] !== "TCM1") return null;
    var b64 = m[1];
    if (chk3(b64) !== m[2]) return null;
    try {
      var p = JSON.parse(atob(b64.replace(/-/g, "+").replace(/_/g, "/")));
      return (p && p.v === 2 && typeof p.s === "number" && Array.isArray(p.a)) ? p : null;
    } catch (e) { return null; }
  }

  function copyCode(){
    var ta = $("codeOut");
    if (!ta) return;
    var txt = ta.value;
    var done = function(){
      var tip = document.querySelector("#panel .codebox .tip");
      if (tip) { tip.textContent = "已复制，粘贴发给老师即可。"; tip.style.color = "var(--ok)"; }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, function(){ legacyCopy(ta, txt, done); });
    } else {
      legacyCopy(ta, txt, done);
    }
  }

  function legacyCopy(ta, txt, done){
    ta.removeAttribute("readonly");
    ta.focus(); ta.select(); ta.setSelectionRange(0, txt.length);
    try { document.execCommand("copy"); done(); } catch (e) {}
    ta.setAttribute("readonly", "readonly");
    try { window.getSelection().removeAllRanges(); } catch (e) {}
  }

  /* ---------- 教师端汇总 ---------- */
  var lastRows = [];

  function teacherStat(){
    var c = cur(), raw = $("tIn").value.split(/[\s,，;；]+/).filter(Boolean);
    var rows = [], badN = 0;
    raw.forEach(function(s){
      var p = decodeCode(s);
      if (!p || p.c !== c.id) { badN++; return; }
      rows.push(p);
    });
    lastRows = rows;
    if (!rows.length) {
      $("tOut").innerHTML = '<p class="placeholder">没有识别到本案的有效答题码'+(badN?("（"+badN+" 条格式不符或非本案）"):"")+'。</p>';
      return;
    }
    var n = rows.length;
    var avg = function(f){ return rows.reduce(function(a, p){ return a + f(p); }, 0) / n; };
    var pct = function(v){ return Math.round(v * 100); };
    var pass = rows.filter(function(p){ return p.s >= 60; }).length;

    var dims = ["四诊", "病机", "治法", "选药", "配伍"], maxs = [20, 25, 15, 25, 15];
    var dimRows = dims.map(function(d, i){
      var m = avg(function(p){ return p.a[i] || 0; });
      return '<tr><td>'+d+'</td><td class="n">'+m.toFixed(1)+' / '+maxs[i]+'</td>'+
        '<td class="n">'+pct(m / maxs[i])+'%</td></tr>';
    }).join("");

    // 三个自由作答步骤：各要点全班命中率
    var kpTable = function(kind, idx){
      var pts = c.kp[kind];
      return pts.map(function(p, i){
        var k = rows.filter(function(r){ return (((r.m && r.m[idx]) || 0) >> i) & 1; }).length;
        var rate = k / n;
        return '<tr><td>'+p.n+'</td><td class="n">'+k+'</td>'+
          '<td class="n '+(rate < 0.6 ? "hot" : "")+'">'+pct(rate)+'%</td></tr>';
      }).join("");
    };

    var eCnt = [0, 1, 2].map(function(i){
      return rows.filter(function(r){ return ((r.e || [])[i] || 0) > 0; }).length;
    });

    var hbRows = c.pool.map(function(id){
      var k = rows.filter(function(p){ return ("," + p.h + ",").indexOf("," + id + ",") >= 0; }).length;
      var tag = c.need[id] ? "核心药" : (c.ok[id] ? "可选" : "不宜");
      var cls = c.need[id] ? (k / n < 0.7 ? "hot" : "") : (c.bad[id] && k ? "hot" : "");
      return '<tr><td>'+HERB[id].n+'</td><td>'+tag+'</td><td class="n">'+k+'</td>'+
        '<td class="n '+cls+'">'+pct(k / n)+'%</td></tr>';
    }).join("");

    var prRows = pairsOf(c).map(function(pr, i){
      var ok = 0, relOnly = 0;
      rows.forEach(function(p){
        var seg = (p.q || "").split(";")[i] || "-1:-1", ab = seg.split(":");
        var oi = Number(ab[0]), ri = Number(ab[1]);
        var pairOk = pr.opts[oi] && (pr.opts[oi][0] + "|" + pr.opts[oi][1] === pr.ans);
        var relOk = pr.relOpts[ri] === pr.rel;
        if (pairOk && relOk) ok++;
        else if (relOk) relOnly++;
      });
      return '<tr><td>'+pr.ans.split("|").map(function(id){ return HERB[id].n; }).join(" + ")+
        '（'+pr.rel+'）</td><td class="n">'+ok+'</td><td class="n">'+pct(ok / n)+'%</td>'+
        '<td class="n '+(relOnly ? "hot" : "")+'">'+relOnly+'</td></tr>';
    }).join("");

    var top = Math.max.apply(null, rows.map(function(p){ return p.s; }));
    var low = Math.min.apply(null, rows.map(function(p){ return p.s; }));

    $("tOut").innerHTML =
      '<div class="tstat">'+
        '<div class="k"><b>'+n+'</b><span>有效答题码</span></div>'+
        '<div class="k"><b>'+avg(function(p){ return p.s; }).toFixed(1)+'</b><span>平均总分</span></div>'+
        '<div class="k"><b>'+pct(pass / n)+'%</b><span>及格率（≥60）</span></div>'+
        '<div class="k"><b>'+top+' / '+low+'</b><span>最高 / 最低</span></div>'+
        '<div class="k"><b>'+Math.round(avg(function(p){ return p.t; }))+'s</b><span>平均用时</span></div>'+
        '<div class="k"><b>'+badN+'</b><span>无效码</span></div>'+
      '</div>'+
      '<h4 style="font-size:13px;color:var(--zheng);margin:14px 0 6px">五项得分均值</h4>'+
      '<table class="tbl"><tr><th>维度</th><th>均值</th><th>得分率</th></tr>'+dimRows+'</table>'+
      '<h4 style="font-size:13px;color:var(--zheng);margin:14px 0 6px">四诊 · 各要点命中率</h4>'+
      '<table class="tbl"><tr><th>要点</th><th>写到人数</th><th>命中率</th></tr>'+kpTable("sx",0)+'</table>'+
      '<h4 style="font-size:13px;color:var(--zheng);margin:14px 0 6px">病机 · 各要点命中率</h4>'+
      '<table class="tbl"><tr><th>要点</th><th>写到人数</th><th>命中率</th></tr>'+kpTable("bj",1)+'</table>'+
      '<h4 style="font-size:13px;color:var(--zheng);margin:14px 0 6px">治法 · 各要点命中率</h4>'+
      '<table class="tbl"><tr><th>要点</th><th>写到人数</th><th>命中率</th></tr>'+kpTable("zf",2)+'</table>'+
      '<h4 style="font-size:13px;color:var(--zheng);margin:14px 0 6px">选药 · 各药被选比例</h4>'+
      '<table class="tbl"><tr><th>药物</th><th>定位</th><th>人数</th><th>比例</th></tr>'+hbRows+'</table>'+
      '<h4 style="font-size:13px;color:var(--zheng);margin:14px 0 6px">配伍 · 药对判断</h4>'+
      '<table class="tbl"><tr><th>药对</th><th>全对人数</th><th>全对率</th><th>仅关系对</th></tr>'+prRows+'</table>'+
      '<p class="desc" style="margin-top:4px">误读/误判人数：四诊 '+eCnt[0]+' 人 · 病机 '+eCnt[1]+' 人 · 治法 '+eCnt[2]+
      ' 人。红色为全班集中问题，可直接作为讲评切入点。</p>';
  }

  function exportCsv(){
    if (!lastRows.length) { alert("请先点击「统计」。"); return; }
    var c = cur();
    var head = ["序号","总分","四诊","病机","治法","选药","配伍","用时秒","四诊要点","病机要点","治法要点","已选药物","药对判定"];
    var lines = [head.join(",")];
    lastRows.forEach(function(p, i){
      var pick = function(kind, idx){
        var mask = (p.m && p.m[idx]) || 0;
        return c.kp[kind].filter(function(_, k){ return (mask >> k) & 1; }).map(function(q){ return q.n; }).join(" ");
      };
      var hb = p.h.split(",").filter(Boolean).map(function(id){ return HERB[id] ? HERB[id].n : id; }).join(" ");
      var pr = (p.q || "").split(";").map(function(seg, k){
        var pair = pairsOf(c)[k];
        if (!pair) return "";
        var ab = seg.split(":"), o = pair.opts[Number(ab[0])];
        return (o ? HERB[o[0]].n + "+" + HERB[o[1]].n : "?") + "/" + (pair.relOpts[Number(ab[1])] || "?");
      }).join(" ; ");
      var row = [i + 1, p.s, p.a[0], p.a[1], p.a[2], p.a[3], p.a[4], p.t,
                 pick("sx",0), pick("bj",1), pick("zf",2), hb, pr];
      lines.push(row.map(function(x){ return '"' + String(x).replace(/"/g, '""') + '"'; }).join(","));
    });
    var blob = new Blob(["\ufeff" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "医案答题统计_" + c.id + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  }

  function renderResult(){
    var c = cur(), r = state.score, a = c.analysis;
    var rows = [
      ["四诊", r.s.sx, 20], ["病机", r.s.bj, 25], ["治法", r.s.zf, 15],
      ["选药", r.s.herb, 25], ["配伍", r.s.pair, 15]
    ];
    var bar = rows.map(function(x){
      return '<div class="bar"><span>'+x[0]+'</span><span class="tr"><span class="fl" style="width:'+
        Math.round(x[1]/x[2]*100)+'%"></span></span><span>'+Math.round(x[1])+'/'+x[2]+'</span></div>';
    }).join("");

    var pairsHtml = pairsOf(c).map(function(pr){
      return '<p><b>'+pr.ans.split("|").map(function(id){ return HERB[id].n; }).join(" + ")+
        '（'+pr.rel+'）</b>　'+pr.meaning+'</p>';
    }).join("");

    var herbHtml = "";
    if (a.herb){
      herbHtml = '<h4>药物解析 · '+a.herb.n+'</h4>' +
        '<p><b>性味归经：</b>'+a.herb.t+'</p>' +
        '<p><b>功效：</b>'+a.herb.g+'</p>' +
        '<table><tr><th style="width:86px">功效</th><th>本案对应</th><th>配伍</th></tr>' +
        a.herb.rows.map(function(x){
          return '<tr><td style="width:86px"><b>'+x[0]+'</b></td><td>'+x[1]+'</td><td>'+x[2]+'</td></tr>';
        }).join("") + '</table>';
    }
    var origHtml = a.orig ? '<h4>原案辨证与用方</h4><p>'+a.orig+'</p>' : "";

    $("panel").innerHTML =
      '<div class="score"><div class="num">'+r.total+'<small> / 100</small></div><div class="bars">'+bar+'</div></div>'+
      '<ul class="fb">'+r.fb.map(function(f){ return '<li class="'+f.t+'">'+f.x+'</li>'; }).join("")+'</ul>'+
      '<div class="codebox"><div class="lbl">答题码 · 复制后交给老师</div>'+
        '<textarea id="codeOut" readonly>'+encodeCode()+'</textarea>'+
        '<div class="row"><button class="btn primary" data-a="copy">复制答题码</button>'+
        '<span class="tip">老师收集答题码后，可统计全班的四诊、病机、治法、选药与配伍情况。</span></div>'+
      '</div>'+
      '<div class="ref">'+
        '<h4>病因病机</h4><p>'+a.bj+'</p>'+
        '<h4>治法</h4><p>'+a.zf+'</p>'+
        '<h4>选药思路</h4><p>'+a.xuanyao+'</p>'+
        '<h4>配伍意义</h4>'+pairsHtml+
        herbHtml+
        origHtml+
        '<h4>鉴别要点</h4><p>'+a.diff+'</p>'+
      '</div>'+
      '<details class="tpl"><summary>教师用：新增医案的字段格式</summary><pre>'+
      esc("{\n  id:\"a2\", title:\"案名\", src:\"出处\",\n  text:\"病案原文（可用 <em> 标出关键句）\",\n  meta:[\"性别·年龄\",\"季节\"], hint:\"读案提示\",\n  kp:{                       // 自由作答的判分要点，每组同义词命中任一即算答到\n    sx:[{n:\"要点名\", k:[\"同义词1\",\"同义词2\"]}, ...],\n    bj:[...], zf:[...]\n  },\n  kpBad:{                    // 写错方向才扣分（原文没有 / 辨证相反）\n    sx:[{n:\"汗出\", k:[\"汗出\"]}, ...], bj:[...], zf:[...]\n  },\n  hint:{                     // 逐层提示，只说往哪看，不给答案\n    sx:[\"提示1\",\"提示2\",\"提示3\"], bj:[...], zf:[...]\n  },\n  pool:[\"mah\",\"gui\",...],\n  need:{ mah:{w:5} }, ok:{ jing:{w:2} },\n  bad:{ bo:{why:\"性凉相悖\"} },\n  pairs:[\n    { opts:[[\"mah\",\"gui\"],[\"mah\",\"xing\"]], ans:\"mah|gui\", rel:\"相须\",\n      relOpts:[\"相须\",\"相使\",\"相畏\",\"相杀\",\"相反\"], meaning:\"...\" }\n  ],\n  analysis:{ bj:\"...\", zf:\"...\", xuanyao:\"选药思路\", diff:\"...\",\n             herb:{ n:\"麻黄\", t:\"性味归经\", g:\"功效\",\n                    rows:[[\"功效\",\"本案对应\",\"配伍\"]] },\n             orig:\"原案辨证与用方\" }\n}")+
      '</pre></details>';

    $("actions").innerHTML =
      '<button class="btn primary" data-a="redo">重做本题</button>'+
      (ADV.length > 1 ? '<button class="btn" data-a="nextcase">下一医案</button>' : '')+
      '<span class="spacer"></span>'+
      '<span class="cnt">对照参考解析，回看自己哪一步失分</span>';
    $("panel").scrollTop = 0;
  }

  /* ---------- 事件 ---------- */
  document.addEventListener("input", function (e) {
    var ta = e.target;
    if (!ta || !ta.dataset || !ta.dataset.free) return;
    state.free[ta.dataset.free] = ta.value;
    renderActions();
  });

  document.addEventListener("click", function (e) {
    var t = e.target;
    var tab = t.closest("[data-ci]");
    if (tab) { reset(Number(tab.dataset.ci)); return; }

    var hb = t.closest("[data-hb]");
    if (hb) {
      var id = hb.dataset.hb;
      if (state.herbs[id]) delete state.herbs[id];
      else {
        if (Object.keys(state.herbs).length >= 5) return;
        state.herbs[id] = true;
      }
      renderPanel(); renderActions(); return;
    }

    var prEl = t.closest("[data-pair]");
    if (prEl) { var pa = prEl.dataset.pair.split(":"); state.pair[pa[0]] = pa.slice(1).join(":"); renderPanel(); renderActions(); return; }

    var rlEl = t.closest("[data-rel]");
    if (rlEl) { var ra = rlEl.dataset.rel.split(":"); state.rel[ra[0]] = ra.slice(1).join(":"); renderPanel(); renderActions(); return; }

    var a = t.closest("[data-a]");
    if (!a) { if (t.id === "tModal") $("tModal").classList.remove("on"); return; }
    var act = a.dataset.a;
    if (act === "check"){
      var box = $("freeBox");
      if (!box) return;
      var kind = box.dataset.free;
      state.free[kind] = box.value;
      state.checked[kind] = true;
      if (freeHits(kind).length < cur().kp[kind].length){
        state.hintLv[kind] = Math.min((state.hintLv[kind] || 0) + 1, cur().hint[kind].length);
      }
      renderAll(); $("panel").scrollTop = 0;
      return;
    }
    if (act === "morehint"){
      var kk = FREE_KIND[state.step];
      state.hintLv[kk] = Math.min((state.hintLv[kk] || 0) + 1, cur().hint[kk].length);
      renderPanel();
      return;
    }
    if (act === "next") { state.step++; state.done = false; renderAll(); }
    if (act === "prev") { state.step--; state.done = false; renderAll(); }
    if (act === "submit") { state.score = computeScore(); state.done = true; renderAll(); }
    if (act === "redo") { reset(state.ci); }
    if (act === "nextcase") { reset((state.ci + 1) % ADV.length); }
    if (act === "copy") { copyCode(); }
    if (act === "teach") { $("tModal").classList.add("on"); $("tIn").focus(); }
    if (act === "tclose") { $("tModal").classList.remove("on"); }
    if (act === "tstat") { teacherStat(); }
    if (act === "tcsv") { exportCsv(); }
    if (act === "tclear") { $("tIn").value = ""; $("tOut").innerHTML = '<p class="placeholder">粘贴答题码后点击「统计」。</p>'; lastRows = []; }
  });

  if (/[?&]t=1(?:&|$)/.test(location.search)) $("tEntry").hidden = false;

  reset(0);
})();
</script>
</body>
